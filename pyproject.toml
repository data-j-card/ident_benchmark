[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "benchid"
version = "0.1.0"
description = "Reproducible benchmark of identity persistence: per-identity LoRA vs reference conditioning"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
medicion = [
    "insightface==2.1",
    "onnxruntime==1.31.0",
    "opencv-python-headless==5.0.0.93",
    "matplotlib==3.11.2",
]
piloto = ["mlflow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
